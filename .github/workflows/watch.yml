name: Source & ecosystem watch

# 這個 repo 的核心宣稱是「每條規則都附出處」。宣稱要一直成立，出處就得
# 一直活著、而且沒有悄悄改掉——官方文件改版通常沒有公告。
#
# ⚠ 設計上的紅線：這個 workflow **只產出報告、開 issue，絕不自動改 skill**。
#   規則要不要跟著改，是需要讀原文判斷的事。讓機器自動改，它會很樂意把
#   一篇部落格的宣稱寫成規則——那正是這個 repo 反對的做法。

on:
  schedule:
    - cron: '0 6 1 * *'      # 每月 1 號 06:00 UTC（台北 14:00）
  workflow_dispatch: {}       # 隨時可手動跑

permissions:
  contents: write             # 需要 write：狀態檔（sources.state.json）要回寫
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 零相依——刻意不用任何 npm 套件，這樣 skill 的使用者可以直接跑腳本
      - name: ① 出處存活檢查
        id: sources
        run: node watch/check-sources.mjs --out report.md

      # 刻意不加 continue-on-error：每家廠商的網路錯誤都在腳本裡個別接住了，
      # 所以這一步失敗＝腳本真的壞了。壞掉要看得見，不要出一份靜靜少了 ② 的報告。
      - name: ② 爬蟲清單檢查
        id: crawlers
        # Meta 的爬蟲文件對一般程式化抓取一律回 400，要靠 Browser Rendering
        # 開真瀏覽器。沒有金鑰時腳本會把那一家標成「本次未檢查」而不是靜靜跳過。
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node watch/check-crawlers.mjs --out report.md --append

      - name: ③ 生態掃描
        id: ecosystem
        # CF_AI_MODEL 刻意可以不設：不設時腳本會查當下的型號清單並印出實際
        # 用了哪一個。寫死型號等於埋一個「供應商下架那天才會炸」的地雷。
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ secrets.CF_AI_MODEL }}
        run: node watch/check-ecosystem.mjs --out report.md --append

      - name: 回寫狀態檔
        # 狀態檔是「上次看到的樣子」，不回寫的話每次都會是 baseline，
        # 永遠偵測不到變動。
        run: |
          if ! git diff --quiet -- watch/sources.state.json watch/ecosystem.state.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add watch/sources.state.json watch/ecosystem.state.json
            git commit -m "watch: 更新狀態基準 [skip ci]"
            git push
          fi

      - name: 開 issue 通知
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create source-watch --color 1d76db --description "定期出處與生態檢查" 2>/dev/null || true
          month="$(date -u +%Y-%m)"
          n1="${{ steps.sources.outputs.sources_actionable }}"
          n2="${{ steps.crawlers.outputs.crawlers_actionable }}"
          n3="${{ steps.ecosystem.outputs.ecosystem_actionable }}"
          total=$(( ${n1:-0} + ${n2:-0} + ${n3:-0} ))
          # 三項分開列，因為處理成本不同：出處變動要回讀原文改規則，爬蟲變動
          # 多半只要更新清單，生態線索則是「要不要花時間讀」的判斷。
          # 合成一個數字會看不出該花多少力氣在哪裡。
          if [ "$total" -gt 0 ]; then
            title="🔔 定期檢查 — 出處 ${n1:-0}／爬蟲 ${n2:-0}／生態 ${n3:-0} — ${month}"
          else
            title="✅ 定期檢查 — ${month}（無變動）"
          fi
          gh issue create --title "$title" --label source-watch --body-file report.md
