<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',-apple-system,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- markerUnits 預設隨 stroke-width 縮放：markerWidth 6 × stroke 4 = 24px 箭頭 -->
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#ffffff"/>
  <rect width="1280" height="8" fill="url(#brand)"/>

  <!-- ── 左欄：識別 ＋ 主打句 ─────────────────── -->
  <text x="80" y="160" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#brand)">YAEO</text>
  <text x="86" y="204" font-size="25" font-weight="500" fill="#666666">Yet Another Engine Optimization</text>

  <text x="80" y="322" font-size="50" font-weight="800" fill="#111111">又一個引擎優化。</text>
  <text x="80" y="390" font-size="50" font-weight="800" fill="#1d4ed8">但每條規則都附出處。</text>

  <!-- ── 右側：四個縮寫兩兩互指（C(4,2) ＝ 6 條）──
       線一律從方塊邊界往外退才起筆，箭頭才不會被方塊蓋住。

       ⚠ 要退的是**垂直於邊界的距離**，不是沿線的距離。第一版對角線沿線退了
       14px，但那只讓它離下緣遠了 14 × 0.469 ≈ 7px——四條正交線 12px、
       兩條對角線 7px，整組看起來不齊。現在統一以垂直距離反推。

       對角線是從**上下緣**出去、不是從角落：水平位移到半寬 90 時，
       垂直位移已達 47.8 > 半高 36。單位向量 (0.883, 0.469)，
       要垂直退 16px → 沿線退 16 ÷ 0.469 ≈ 34，總位移 (97.9, 52)。 -->
  <g stroke="#1d4ed8" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)" opacity="0.9">
    <line x1="868"  y1="146" x2="1014" y2="146"/>
    <line x1="868"  y1="332" x2="1014" y2="332"/>
    <line x1="766"  y1="194" x2="766"  y2="284"/>
    <line x1="1116" y1="194" x2="1116" y2="284"/>
    <line x1="864"  y1="198" x2="1018" y2="280"/>
    <line x1="1018" y1="198" x2="864"  y2="280"/>
  </g>

  <g font-size="34" font-weight="700" text-anchor="middle">
    <g>
      <rect x="676" y="110" width="180" height="72" rx="14" fill="#f0f4f8" stroke="#e8e8e8" stroke-width="2"/>
      <text x="766" y="157" fill="#111111">SEO</text>
    </g>
    <g>
      <rect x="1026" y="110" width="180" height="72" rx="14" fill="#f0f4f8" stroke="#e8e8e8" stroke-width="2"/>
      <text x="1116" y="157" fill="#111111">AEO</text>
    </g>
    <g>
      <rect x="676" y="296" width="180" height="72" rx="14" fill="#f0f4f8" stroke="#e8e8e8" stroke-width="2"/>
      <text x="766" y="343" fill="#111111">GEO</text>
    </g>
    <g>
      <rect x="1026" y="296" width="180" height="72" rx="14" fill="#f0f4f8" stroke="#e8e8e8" stroke-width="2"/>
      <text x="1116" y="343" fill="#111111">LLMO</text>
    </g>
  </g>

  <text x="941" y="418" font-size="23" text-anchor="middle" fill="#666666">縮寫每季都在增加。這個 repo 不打算再發明一個。</text>

  <line x1="80" y1="486" x2="1200" y2="486" stroke="#e8e8e8" stroke-width="2"/>

  <g font-size="22" fill="#666666" font-family="'SF Mono','Fira Code',Consolas,monospace">
    <text x="80" y="552">github.com/matt-ye/yaeo</text>
    <!-- 這裡刻意不寫規則條數：圖是最難更新的載體（要重畫、重轉檔、重上傳），
         最不該放會變動的數字。第一版寫了「52 條規則」，一天不到就變成 56。 -->
    <text x="1200" y="552" text-anchor="end">Claude Code skill · 四層檢核 · MIT</text>
  </g>
</svg>
